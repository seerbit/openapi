      operationId: get_query-bulk-charge_25
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: batchId
          in: query
          required: false
          description: Query parameter batchId
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
