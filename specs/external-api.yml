        | `description` | string | Yes | Shown to the customer on the payment page |

        | `currency` | string | Yes | Currency code, e.g. `NGN` |

        | `publicKey` | string | Yes | Merchant public key |

        | `paymentFrequency` | string | Yes | `ONE_TIME` or `RECURRENT` |

        | `requiredFields` | object | Yes | Which customer fields the payer must fill in: `address`, `amount`, `customerName`, `mobileNumber`, `invoiceNumber` (each boolean) |

        | `email` | string | No | Notification email |

