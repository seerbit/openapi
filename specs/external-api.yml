openapi: 3.0.3
info:
  title: SeerBit External API Reference
  version: "1.0"
  description: OpenAPI reference generated from the current Postman collection.
    Each operation corresponds directly to a request in the Postman collection.
servers:
  - url: https://seerbitapi.com
tags:
  - name: AUTHENTICATION
    description: Create the encrypted key used as the Bearer token for authenticated
      SeerBit API requests.
  - name: STANDARD CHECKOUT
    description: Create hosted checkout payment links, including normal and
      split-payment flows.
  - name: VIRTUAL ACCOUNTS
    description: Create and manage virtual bank accounts and retrieve their payment
      activity.
  - name: PAYMENT METHODS
    description: Initiate direct payments by card, bank account, transfer, USSD, or
      mobile money.
  - name: PAYMENT QUERY
    description: Look up the current result and details of a payment using its reference.
  - name: INVOICING
    description: Create, send, retrieve, and manage merchant invoices.
  - name: PARTNERS API
    description: Authenticate partner accounts and manage invited businesses,
      commissions, and partner credentials.
  - name: TOKENIZATION
    description: Tokenize cards and use authorization tokens for subsequent or bulk charges.
  - name: RECURRING & SUBSCRIPTIONS
    description: Create and manage subscription plans, customer subscriptions, and
      recurring charges.
  - name: PAYMENT LINKS
    description: Create, retrieve, update, and remove reusable payment links.
  - name: POCKET
    description: Authenticate and manage SeerBit Pockets, including balances,
      sub-pockets, and internal transfers.
  - name: PAYOUT
    description: Verify destination accounts and initiate or confirm external bank payouts.
  - name: WEBHOOKS (REFERENCE)
    description: Reference payloads SeerBit sends to your callback URL for
      payment-related events.
paths:
  /api/v2/encrypt/keys:
    post:
      tags:
        - AUTHENTICATION
      summary: Generate Encrypted Key
      description: Create the encrypted key used as the Bearer token for authenticated
        SeerBit API requests.
      operationId: post_generate-encrypted-key_0
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        description: >-
          Exchanges your `SECRET_KEY` and `publicKey` for an `EncryptedSecKey`.
          Use that value as the `BearerToken` collection variable — it's the
          Bearer token for every other authenticated request here. Call this
          once per session, or whenever your key changes; it does not expire on
          a fixed schedule but should be re-generated if a request starts
          failing auth.


          **Body fields**

          This endpoint is intentionally **No Auth** — you don't have a token yet when you call it.
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: "Your `SECRET_KEY` and `publicKey` joined with a period:
                    `SECRET_KEY.publicKey`"
              required:
                - key
            examples:
              generate-encrypted-key:
                summary: Generate Encrypted Key
                value:
                  key: "{{SECRET_KEY}}.{{publicKey}}"
      responses:
        "200":
          description: Successful response
  /api/v2/encrypt/hashs:
    post:
      tags:
        - AUTHENTICATION
      summary: Generate Hash
      description: Create the encrypted key used as the Bearer token for authenticated
        SeerBit API requests.
      operationId: post_generate-hash_1
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                paymentReference:
                  type: string
                planId:
                  type: string
                cardNumber:
                  type: string
                expiryMonth:
                  type: string
                callbackUrl:
                  type: string
                expiryYear:
                  type: string
                cvv:
                  type: string
                amount:
                  type: string
                currency:
                  type: string
                productDescription:
                  type: string
                productId:
                  type: string
                country:
                  type: string
                startDate:
                  type: string
                cardName:
                  type: string
                billingCycle:
                  type: string
                email:
                  type: string
                mobileNumber:
                  type: string
                billingPeriod:
                  type: string
                subscriptionAmount:
                  type: boolean
            examples:
              generate-hash:
                summary: Generate Hash
                value:
                  publicKey: "{{publicKey}}"
                  paymentReference: sub_ref_001
                  planId: "{{planId}}"
                  cardNumber: "5123450000000008"
                  expiryMonth: "01"
                  callbackUrl: https://example.com/callback
                  expiryYear: "28"
                  cvv: "000"
                  amount: "100"
                  currency: NGN
                  productDescription: Subscription
                  productId: product222
                  country: NG
                  startDate: 2026-09-01
                  cardName: Jane Doe
                  billingCycle: MONTHLY
                  email: customer@example.com
                  mobileNumber: "08012345678"
                  billingPeriod: "1"
                  subscriptionAmount: false
        description: >-
          Generic hash-generation endpoint — you pass the exact same body as the
          request you want a hash for, and SeerBit returns a hash you attach to
          that other call. The doc page's own worked example happens to use a
          subscription-creation payload (shown in this request's saved body);
          swap the body for whatever request you're actually hashing, keeping
          the same field names and types that request expects.


          **Verification note:** The available response example describes the _downstream_ payment response (`redirectUrl`, `paymentReference`) rather than the response returned by this endpoint. Confirm the actual response shape with a live sandbox call before relying on it.
      responses:
        "200":
          description: Successful response
  /api/v2/payments:
    post:
      tags:
        - STANDARD CHECKOUT
      summary: Normal Payment (No Split)
      description: Create hosted checkout payment links, including normal and
        split-payment flows.
      operationId: post_normal-payment-no-split_2
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                  description: Merchant public key from the dashboard
                amount:
                  type: string
                  description: Amount to charge
                currency:
                  type: string
                  description: Transaction currency, e.g. `NGN`, `USD`
                country:
                  type: string
                  description: Country the transaction originates from
                paymentReference:
                  type: string
                  description: Unique reference you generate per transaction
                email:
                  type: string
                  description: Customer email address
                fullName:
                  type: string
                  description: Customer full name
                callbackUrl:
                  type: string
                  description: Where SeerBit redirects the customer after payment
                tokenize:
                  type: boolean
                  description: "**Confirmed by SeerBit.** If `true`: (1) the checkout page on
                    `redirectLink` only offers **Card** as a payment method — no
                    bank transfer, USSD, or other channels; (2) SeerBit
                    tokenizes the card, and the resulting `authorizationCode` is
                    not in this endpoint's own response — it's returned when you
                    call **Check Payment Status** afterward with the
                    `paymentReference`. Use that `authorizationCode` with
                    *Charge Authorization Token* / *Bulk Charge Token* to charge
                    the same card again. Defaults to `false` if omitted."
              required:
                - publicKey
                - amount
                - currency
                - country
                - paymentReference
                - email
                - fullName
                - callbackUrl
            examples:
              normal-payment-no-split:
                summary: Normal Payment (No Split)
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference8
                  email: customer@example.com
                  fullName: Jane Doe
                  tokenize: false
                  callbackUrl: https://example.com/callback
        description: >-
          Creates a transaction and returns a `redirectLink` to SeerBit's hosted
          checkout page — send the customer there to enter payment details and
          complete the charge. No card data touches your server with this flow,
          and the full amount settles to your main merchant account with no
          split.


          **Body fields**


          This is the baseline request with no split fields — see the sibling requests in this folder **Standard Checkout — Easy Split (Split Code)** and **Standard Checkout — Full Dynamic Split** for the two ways to divide a payment across sub-accounts.


          A `409` means `paymentReference` has already been used — generate a new one per attempt, don't retry with the same value.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments#standard-checkout-easy-split-split-code:
    post:
      tags:
        - STANDARD CHECKOUT
      summary: Standard Checkout — Easy Split (Split Code)
      description: Create hosted checkout payment links, including normal and
        split-payment flows.
      operationId: post_standard-checkout-easy-split-split-code_3
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                splitCode:
                  type: string
                  description: Reference to a split rule created in advance on the SeerBit
                    dashboard.
                tokenize:
                  type: boolean
                  description: "**Confirmed by SeerBit.** If `true`, the checkout page restricts
                    payment to **Card only**, and the `authorizationCode` for
                    the tokenized card comes back from **Check Payment Status**,
                    not this endpoint's own response. Defaults to `false`."
              required:
                - splitCode
            examples:
              standard-checkout-easy-split-split-code:
                summary: Standard Checkout — Easy Split (Split Code)
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_split_code1
                  email: customer@example.com
                  fullName: Jane Doe
                  tokenize: false
                  callbackUrl: https://example.com/callback
                  splitCode: SPLIT_RULE_CODE
        description: >-
          Same Standard Checkout flow as **Normal Payment (No Split)**, plus a
          single `splitCode` field: the code of a split rule you pre-configure
          once (recipients, percentages/amounts, fee bearer) on the SeerBit
          dashboard, then reference by code at payment time. This is the "easy"
          option — you don't specify recipients or amounts inline; the rule
          already defines them.


          Use this when your split recipients and their shares are fixed and known ahead of time. If you need to set the split's recipients or shares dynamically per transaction, use **Standard Checkout — Full Dynamic Split** instead.


          **Verification note:** doc.seerbit.com documents `splitCode` only as `"Split rule Code"` in an example body. Confirm how split rules are created and the exact code format in your dashboard before using this field.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments#standard-checkout-full-dynamic-split:
    post:
      tags:
        - STANDARD CHECKOUT
      summary: Standard Checkout — Full Dynamic Split
      description: Create hosted checkout payment links, including normal and
        split-payment flows.
      operationId: post_standard-checkout-full-dynamic-split_4
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: "`FLAT` (fixed amount per recipient) or `PERCENTAGE`"
                transactionFee:
                  type: string
                  description: Who bears the transaction fee — `ALL_ACCOUNTS`, `PROPORTIONATE`,
                    `SUB_ACCOUNT`, or `PARENT_ACCOUNT`
                bearerSubAccountCode:
                  type: string
                  description: Which sub-account bears the fee
                items:
                  type: array
                  description: "Each entry: `subAccountCode` and its `value` (amount or
                    percentage, matching `type`)"
                tokenize:
                  type: boolean
                  description: "**Confirmed by SeerBit.** If `true`, the checkout page restricts
                    payment to **Card only**, and the `authorizationCode` for
                    the tokenized card comes back from **Check Payment Status**,
                    not this endpoint's own response. Defaults to `false`."
              required:
                - type
                - transactionFee
                - items
            examples:
              standard-checkout-full-dynamic-split:
                summary: Standard Checkout — Full Dynamic Split
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_dynamic1
                  email: customer@example.com
                  fullName: Jane Doe
                  tokenize: false
                  callbackUrl: https://example.com/callback
                  splits:
                    type: PERCENTAGE
                    transactionFee: PARENT_ACCOUNT
                    items:
                      - subAccountCode: SUB_ACC_001
                        value: "30"
        description: >-
          Same Standard Checkout flow as **Normal Payment (No Split)**, plus a
          `splits` object defining recipients and shares inline, at payment time
          — no pre-configured split rule needed. Use this when split details
          aren't known in advance (e.g. a marketplace computing a different
          vendor split per order).


          **`splits` object fields**


          Compare **Standard Checkout — Easy Split (Split Code)**, which references a split rule you configured ahead of time instead of specifying recipients inline.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/virtual-accounts:
    post:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Create Virtual Account
      description: Create and manage virtual bank accounts and retrieve their payment
        activity.
      operationId: post_create-virtual-account_5
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                  description: Merchant public key
                fullName:
                  type: string
                  description: Customer's full name, used as the account name
                email:
                  type: string
                  description: Customer email
                currency:
                  type: string
                  description: Currency code, e.g. `NGN`
                country:
                  type: string
                  description: Country code, e.g. `NG`
                reference:
                  type: string
                  description: Your unique reference for this virtual account — also used to
                    fetch/delete it later
                bankVerificationNumber:
                  type: string
                  description: Customer's BVN, for verification
              required:
                - publicKey
                - fullName
                - email
                - currency
                - country
                - reference
            examples:
              create-virtual-account:
                summary: Create Virtual Account
                value:
                  publicKey: "{{publicKey}}"
                  fullName: Jane Smith
                  bankVerificationNumber: ""
                  currency: NGN
                  country: NG
                  reference: FIRST_VIRTUAL_17
                  email: js@emaildomain.com
        description: >-
          Issues a dedicated bank account number for one customer. Transfers
          into that account are reconciled back to the customer automatically —
          use *Get Payments* to see what's landed on it.


          **Body fields**


          Response returns `walletName`, `bankName`, and `accountNumber` for the customer to pay into.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v2/virtual-accounts/{paymentReference}":
    get:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Get Virtual Account
      description: Fetches details for one virtual account by the `reference` used to
        create it (passed here as `paymentReference`). Response includes
        `linkingReference`, `wallet`, `bankName`, and `accountNumber`.
      operationId: get_get-virtual-account_6
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: paymentReference
          in: path
          required: true
          description: Value of paymentReference
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v2/virtual-accounts/{reference}":
    delete:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Delete Virtual Account
      description: Deactivates a virtual account by its `reference`. On success,
        returns a confirmation message — "Virtual account has been deleted".
      operationId: delete_delete-virtual-account_7
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: reference
          in: path
          required: true
          description: Value of reference
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v2/virtual-accounts/{publicKey}/{accountNumber}":
    get:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Get Payments
      description: "Lists transactions that have landed on one virtual account,
        identified by `publicKey` and `accountNumber` in the path. Each entry
        includes `amount`, customer name, `paymentType`, `status`, settlement
        info, and `transferType: RESERVE_ACCOUNT`."
      operationId: get_get-payments_8
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: publicKey
          in: path
          required: true
          description: Value of publicKey
          schema:
            type: string
        - name: accountNumber
          in: path
          required: true
          description: Value of accountNumber
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates:
    post:
      tags:
        - PAYMENT METHODS
      summary: Card Payment
      description: Initiate direct payments by card, bank account, transfer, USSD, or
        mobile money.
      operationId: post_card-payment_9
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                  description: Merchant public key
                amount:
                  type: string
                  description: Amount to charge
                currency:
                  type: string
                  description: e.g. `NGN`
                country:
                  type: string
                  description: Country code
                paymentReference:
                  type: string
                  description: Unique reference you generate
                email:
                  type: string
                  description: Customer email
                fullName:
                  type: string
                  description: Customer full name
                paymentType:
                  type: string
                  description: "`CARD` for this flow"
                cardDetails:
                  type: string
                  description: Card number
                callbackUrl:
                  type: string
                  description: Where SeerBit sends the final result
              required:
                - publicKey
                - amount
                - currency
                - country
                - paymentReference
                - email
                - fullName
                - paymentType
                - cardDetails
                - callbackUrl
            examples:
              card-payment:
                summary: Card Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_card1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: CARD
                  cardDetails:
                    pan: "5060990580000217499"
                    expiryMonth: "03"
                    expiryYear: "2027"
                    cvv: "111"
                  callbackUrl: https://example.com/callback
        description: >-
          Direct/inline card charge — you collect the card's PAN, expiry and CVV
          on your own form and POST them here, instead of redirecting the
          customer to SeerBit's hosted page (compare **Standard Checkout**,
          which never touches raw card data on your server). Because this
          endpoint receives raw card details, your integration is in PCI-DSS
          scope — SeerBit's hosted **Standard Checkout** flow is the
          lower-compliance-burden alternative most integrators should default
          to.


          **Body fields**


          **OTP step**: many card transactions come back requiring 3DS/OTP authentication. Per the Card Payment doc page, you complete this by POSTing again to this **same** `/api/v2/payments/initiates` URL with a body shaped like:

          ```json

          {
            "transaction": {
              "linkingreference": "<from initial response>",
              "otp": "<code entered by customer>"
            }
          }

          ```

          Then poll **Check Payment Status** (Payment Query folder) with `paymentReference` to confirm the final state.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#bank-account-payment:
    post:
      tags:
        - PAYMENT METHODS
      summary: Bank Account Payment
      description: Initiate direct payments by card, bank account, transfer, USSD, or
        mobile money.
      operationId: post_bank-account-payment_10
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                amount:
                  type: string
                currency:
                  type: string
                country:
                  type: string
                paymentReference:
                  type: string
                email:
                  type: string
                fullName:
                  type: string
                paymentType:
                  type: string
                  description: Confirm the value for this flow with SeerBit before sending the
                    request.
                accountNumber:
                  type: string
                bankCode:
                  type: string
                callbackUrl:
                  type: string
            examples:
              bank-account-payment:
                summary: Bank Account Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_bank1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: <confirm paymentType>
                  accountNumber: "0000000000"
                  bankCode: "058"
                  callbackUrl: https://example.com/callback
        description: >-
          Initiates a direct bank-account debit: the customer authorizes a
          charge straight from their bank account (via account number + bank
          code) rather than a card, USSD code, or transfer-in.


          **Verification note:** Confirm these two details with SeerBit before using this request:

          1. The exact `paymentType` value for this flow. The available documentation does not specify it, so the sample uses `<confirm paymentType>` as a placeholder.

          2. The OTP/authorization endpoint. The documentation references **`/payments/validate`** without specifying its full URL, method, or body. The Card Payment documentation instead describes a second POST to `/api/v2/payments/initiates` with a `{"transaction": {"linkingreference":..., "otp":...}}` body; confirm which flow applies here.


          **Body fields** (`accountNumber` + `bankCode` identify the account to debit; other fields match Card Payment). Verify the `paymentType` value and validation step directly with SeerBit before relying on this request.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#transfer:
    post:
      tags:
        - PAYMENT METHODS
      summary: Transfer
      description: Initiate direct payments by card, bank account, transfer, USSD, or
        mobile money.
      operationId: post_transfer_11
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentType:
                  type: string
                  description: "`TRANSFER`"
              required:
                - paymentType
            examples:
              transfer:
                summary: Transfer
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_transfer1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: TRANSFER
                  callbackUrl: https://example.com/callback
        description: >-
          Initiates a bank-transfer payment: SeerBit returns a dynamic virtual
          account number for this transaction that the customer transfers the
          exact amount into from their own banking app; SeerBit matches the
          credit and confirms the transaction. This is distinct from the
          **Virtual Accounts** folder, which provisions a *persistent* account
          number for a customer across many transactions — this is a one-off,
          per-transaction account.


          **Body fields**


          Poll **Check Payment Status** (Payment Query folder) with `paymentReference`, or listen for the `transaction` webhook, to detect when the transfer lands.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#ussd-payment:
    post:
      tags:
        - PAYMENT METHODS
      summary: USSD Payment
      description: Initiate direct payments by card, bank account, transfer, USSD, or
        mobile money.
      operationId: post_ussd-payment_12
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentType:
                  type: string
                  description: "`USSD`"
                bankCode:
                  type: string
                  description: Bank's USSD routing code, e.g. `058` for GTBank
              required:
                - paymentType
                - bankCode
            examples:
              ussd-payment:
                summary: USSD Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_ussd1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: USSD
                  bankCode: "058"
                  callbackUrl: https://example.com/callback
        description: >-
          Initiates a USSD payment: SeerBit returns a USSD string (e.g.
          `*723*...#`) the customer dials on their phone from the bank account
          linked to `bankCode` to authorize the debit — no card or app needed.


          **Body fields**


          The initial response includes the USSD code to display to the customer. Poll **Check Payment Status** (Payment Query folder) with `paymentReference` — there's no separate OTP step; authorization happens on the phone via the USSD session itself.
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#mobile-money-payment:
    post:
      tags:
        - PAYMENT METHODS
      summary: Mobile Money Payment
      description: Initiate direct payments by card, bank account, transfer, USSD, or
        mobile money.
      operationId: post_mobile-money-payment_13
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentType:
                  type: string
                  description: "`MOMO`"
                mobileNumber:
                  type: string
                  description: Customer's mobile-money-linked phone number
                network:
                  type: string
                  description: Mobile network operator, e.g. `MTN`, `AIRTELTIGO`, `VODAFONE`
              required:
                - paymentType
                - mobileNumber
                - network
            examples:
              mobile-money-payment:
                summary: Mobile Money Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: GHS
