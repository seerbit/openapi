openapi: 3.0.3
info:
  title: SeerBit External API Reference
  version: "1.0"
  description: OpenAPI reference generated from the current Postman collection.
    Each operation corresponds directly to a request in the Postman collection.
servers:
  - url: https://seerbitapi.com
tags:
  - name: AUTHENTICATION
    description: Create the encrypted key used as the Bearer token for authenticated
      SeerBit API requests.
  - name: STANDARD CHECKOUT
    description: Create hosted checkout payment links, including normal and
      split-payment flows.
  - name: VIRTUAL ACCOUNTS
    description: Create and manage virtual bank accounts and retrieve their payment
      activity.
  - name: PAYMENT METHODS
    description: Initiate direct payments by card, bank account, transfer, USSD, or
      mobile money.
  - name: PAYMENT QUERY
    description: Look up the current result and details of a payment using its reference.
  - name: INVOICING
    description: Create, send, retrieve, and manage merchant invoices.
  - name: TOKENIZATION
    description: Tokenize cards and use authorization tokens for subsequent or bulk charges.
  - name: RECURRING & SUBSCRIPTIONS
    description: Create and manage subscription plans, customer subscriptions, and
      recurring charges.
  - name: PAYMENT LINKS
    description: Create, retrieve, update, and remove reusable payment links.
  - name: POCKET
    description: Authenticate and manage SeerBit Pockets, including balances,
      sub-pockets, and internal transfers.
  - name: PAYOUT
    description: Verify destination accounts and initiate or confirm external bank payouts.
  - name: PARTNERS API
    description: Authenticate partner accounts and manage invited businesses,
      commissions, and partner credentials.
  - name: WEBHOOKS (REFERENCE)
    description: Reference payloads SeerBit sends to your callback URL for
      payment-related events.
paths:
  /api/v2/encrypt/keys:
    post:
      tags:
        - AUTHENTICATION
      summary: Generate Encrypted Key
      description: >-
        Exchanges your `SECRET_KEY` and `publicKey` for an `EncryptedSecKey`.
        Use that value as the `BearerToken` collection variable — it's the
        Bearer token for every other authenticated request here. Call this once
        per session, or whenever your key changes; it does not expire on a fixed
        schedule but should be re-generated if a request starts failing auth.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `key` | string | Yes | Your `SECRET_KEY` and `publicKey` joined with a period: `SECRET_KEY.publicKey` |


        This endpoint is intentionally **No Auth** — you don't have a token yet when you call it.
      operationId: post_generate-encrypted-key_0
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              generate-encrypted-key:
                summary: Generate Encrypted Key
                value:
                  key: "{{SECRET_KEY}}.{{publicKey}}"
      responses:
        "200":
          description: Successful response
  /api/v2/encrypt/hashs:
    post:
      tags:
        - AUTHENTICATION
      summary: Generate Hash
      description: >-
        Generic hash-generation endpoint — you pass the exact same body as the
        request you want a hash for, and SeerBit returns a hash you attach to
        that other call. The doc page's own worked example happens to use a
        subscription-creation payload (shown in this request's saved body); swap
        the body for whatever request you're actually hashing, keeping the same
        field names and types that request expects.


        **Not independently re-confirmed in this pass:** the doc page's response example describes the _downstream_ payment response (redirectUrl, paymentReference) rather than what this endpoint itself returns — no saved example response here; verify against a live sandbox call before relying on the shape.
      operationId: post_generate-hash_1
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              generate-hash:
                summary: Generate Hash
                value:
                  publicKey: "{{publicKey}}"
                  paymentReference: sub_ref_001
                  planId: "{{planId}}"
                  cardNumber: "5123450000000008"
                  expiryMonth: "01"
                  callbackUrl: https://example.com/callback
                  expiryYear: "28"
                  cvv: "000"
                  amount: "100"
                  currency: NGN
                  productDescription: Subscription
                  productId: product222
                  country: NG
                  startDate: 2026-09-01
                  cardName: Jane Doe
                  billingCycle: MONTHLY
                  email: customer@example.com
                  mobileNumber: "08012345678"
                  billingPeriod: "1"
                  subscriptionAmount: false
      responses:
        "200":
          description: Successful response
  /api/v2/payments:
    post:
      tags:
        - STANDARD CHECKOUT
      summary: Normal Payment (No Split)
      description: >-
        Creates a transaction and returns a `redirectLink` to SeerBit's hosted
        checkout page — send the customer there to enter payment details and
        complete the charge. No card data touches your server with this flow,
        and the full amount settles to your main merchant account with no split.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `publicKey` | string | Yes | Merchant public key from the dashboard |

        | `amount` | string | Yes | Amount to charge |

        | `currency` | string | Yes | Transaction currency, e.g. `NGN`, `USD` |

        | `country` | string | Yes | Country the transaction originates from |

        | `paymentReference` | string | Yes | Unique reference you generate per transaction |

        | `email` | string | Yes | Customer email address |

        | `fullName` | string | Yes | Customer full name |

        | `callbackUrl` | string | Yes | Where SeerBit redirects the customer after payment |

        | `tokenize` | boolean | No | **Confirmed by SeerBit.** If `true`: (1) the checkout page on `redirectLink` only offers **Card** as a payment method — no bank transfer, USSD, or other channels; (2) SeerBit tokenizes the card, and the resulting `authorizationCode` is not in this endpoint's own response — it's returned when you call **Check Payment Status** afterward with the `paymentReference`. Use that `authorizationCode` with *Charge Authorization Token* / *Bulk Charge Token* to charge the same card again. Defaults to `false` if omitted. |


        This is the baseline request with no split fields — see the sibling requests in this folder **Standard Checkout — Easy Split (Split Code)** and **Standard Checkout — Full Dynamic Split** for the two ways to divide a payment across sub-accounts.


        A `409` means `paymentReference` has already been used — generate a new one per attempt, don't retry with the same value.
      operationId: post_normal-payment-no-split_2
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              normal-payment-no-split:
                summary: Normal Payment (No Split)
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference8
                  email: customer@example.com
                  fullName: Jane Doe
                  tokenize: false
                  callbackUrl: https://example.com/callback
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments#standard-checkout-easy-split-split-code:
    post:
      tags:
        - STANDARD CHECKOUT
      summary: Standard Checkout — Easy Split (Split Code)
      description: >-
        Same Standard Checkout flow as **Normal Payment (No Split)**, plus a
        single `splitCode` field: the code of a split rule you pre-configure
        once (recipients, percentages/amounts, fee bearer) on the SeerBit
        dashboard, then reference by code at payment time. This is the "easy"
        option — you don't specify recipients or amounts inline; the rule
        already defines them.


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `splitCode` | string | Yes (for this variant) | Reference to a split rule created in advance on the SeerBit dashboard. |

        | `tokenize` | boolean | No | **Confirmed by SeerBit.** If `true`, the checkout page restricts payment to **Card only**, and the `authorizationCode` for the tokenized card comes back from **Check Payment Status**, not this endpoint's own response. Defaults to `false`. |

        | *(all other fields)* | | Yes | Same as **Normal Payment (No Split)** |


        Use this when your split recipients and their shares are fixed and known ahead of time. If you need to set the split's recipients or shares dynamically per transaction, use **Standard Checkout — Full Dynamic Split** instead.


        **Not fully confirmed**: doc.seerbit.com documents `splitCode` only as `"Split rule Code"` in an example body, without a dedicated page describing how split rules are created on the dashboard or the exact code format — check your dashboard's split-rule setup screen for the value to use here.
      operationId: post_standard-checkout-easy-split-split-code_3
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              standard-checkout-easy-split-split-code:
                summary: Standard Checkout — Easy Split (Split Code)
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_split_code1
                  email: customer@example.com
                  fullName: Jane Doe
                  tokenize: false
                  callbackUrl: https://example.com/callback
                  splitCode: SPLIT_RULE_CODE
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments#standard-checkout-full-dynamic-split:
    post:
      tags:
        - STANDARD CHECKOUT
      summary: Standard Checkout — Full Dynamic Split
      description: >-
        Same Standard Checkout flow as **Normal Payment (No Split)**, plus a
        `splits` object defining recipients and shares inline, at payment time —
        no pre-configured split rule needed. Use this when split details aren't
        known in advance (e.g. a marketplace computing a different vendor split
        per order).


        **`splits` object fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `type` | string | Yes | `FLAT` (fixed amount per recipient) or `PERCENTAGE` |

        | `transactionFee` | string | Yes | Who bears the transaction fee — `ALL_ACCOUNTS`, `PROPORTIONATE`, `SUB_ACCOUNT`, or `PARENT_ACCOUNT` |

        | `bearerSubAccountCode` | string | Only if `transactionFee` is `SUB_ACCOUNT` | Which sub-account bears the fee |

        | `items` | array | Yes | Each entry: `subAccountCode` and its `value` (amount or percentage, matching `type`) |


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `tokenize` | boolean | No | **Confirmed by SeerBit.** If `true`, the checkout page restricts payment to **Card only**, and the `authorizationCode` for the tokenized card comes back from **Check Payment Status**, not this endpoint's own response. Defaults to `false`. |

        | *(all other core fields)* | | Yes | Same as **Normal Payment (No Split)** |


        Compare **Standard Checkout — Easy Split (Split Code)**, which references a split rule you configured ahead of time instead of specifying recipients inline.
      operationId: post_standard-checkout-full-dynamic-split_4
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              standard-checkout-full-dynamic-split:
                summary: Standard Checkout — Full Dynamic Split
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_dynamic1
                  email: customer@example.com
                  fullName: Jane Doe
                  tokenize: false
                  callbackUrl: https://example.com/callback
                  splits:
                    type: PERCENTAGE
                    transactionFee: PARENT_ACCOUNT
                    items:
                      - subAccountCode: SUB_ACC_001
                        value: "30"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/virtual-accounts:
    post:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Create Virtual Account
      description: >-
        Issues a dedicated bank account number for one customer. Transfers into
        that account are reconciled back to the customer automatically — use
        *Get Payments* to see what's landed on it.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `publicKey` | string | Yes | Merchant public key |

        | `fullName` | string | Yes | Customer's full name, used as the account name |

        | `email` | string | Yes | Customer email |

        | `currency` | string | Yes | Currency code, e.g. `NGN` |

        | `country` | string | Yes | Country code, e.g. `NG` |

        | `reference` | string | Yes | Your unique reference for this virtual account — also used to fetch/delete it later |

        | `bankVerificationNumber` | string | No | Customer's BVN, for verification |


        Response returns `walletName`, `bankName`, and `accountNumber` for the customer to pay into.
      operationId: post_create-virtual-account_5
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              create-virtual-account:
                summary: Create Virtual Account
                value:
                  publicKey: "{{publicKey}}"
                  fullName: Jane Smith
                  bankVerificationNumber: ""
                  currency: NGN
                  country: NG
                  reference: FIRST_VIRTUAL_17
                  email: js@emaildomain.com
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v2/virtual-accounts/{paymentReference}":
    get:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Get Virtual Account
      description: Fetches details for one virtual account by the `reference` used to
        create it (passed here as `paymentReference`). Response includes
        `linkingReference`, `wallet`, `bankName`, and `accountNumber`.
      operationId: get_get-virtual-account_6
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: paymentReference
          in: path
          required: true
          description: Value of paymentReference
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v2/virtual-accounts/{reference}":
    delete:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Delete Virtual Account
      description: Deactivates a virtual account by its `reference`. On success,
        returns a confirmation message — "Virtual account has been deleted".
      operationId: delete_delete-virtual-account_7
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: reference
          in: path
          required: true
          description: Value of reference
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v2/virtual-accounts/{publicKey}/{accountNumber}":
    get:
      tags:
        - VIRTUAL ACCOUNTS
      summary: Get Payments
      description: "Lists transactions that have landed on one virtual account,
        identified by `publicKey` and `accountNumber` in the path. Each entry
        includes `amount`, customer name, `paymentType`, `status`, settlement
        info, and `transferType: RESERVE_ACCOUNT`."
      operationId: get_get-payments_8
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: publicKey
          in: path
          required: true
          description: Value of publicKey
          schema:
            type: string
        - name: accountNumber
          in: path
          required: true
          description: Value of accountNumber
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates:
    post:
      tags:
        - PAYMENT METHODS
      summary: Card Payment
      description: >-
        Direct/inline card charge — you collect the card's PAN, expiry and CVV
        on your own form and POST them here, instead of redirecting the customer
        to SeerBit's hosted page (compare **Standard Checkout**, which never
        touches raw card data on your server). Because this endpoint receives
        raw card details, your integration is in PCI-DSS scope — SeerBit's
        hosted **Standard Checkout** flow is the lower-compliance-burden
        alternative most integrators should default to.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `publicKey` | string | Yes | Merchant public key |

        | `amount` | string | Yes | Amount to charge |

        | `currency` | string | Yes | e.g. `NGN` |

        | `country` | string | Yes | Country code |

        | `paymentReference` | string | Yes | Unique reference you generate |

        | `email` | string | Yes | Customer email |

        | `fullName` | string | Yes | Customer full name |

        | `paymentType` | string | Yes | `CARD` for this flow |

        | `cardDetails.pan` | string | Yes | Card number |

        | `cardDetails.expiryMonth` / `expiryYear` | string | Yes | Card expiry |

        | `cardDetails.cvv` | string | Yes | Card CVV |

        | `callbackUrl` | string | Yes | Where SeerBit sends the final result |


        **OTP step**: many card transactions come back requiring 3DS/OTP authentication. Per the Card Payment doc page, you complete this by POSTing again to this **same** `/api/v2/payments/initiates` URL with a body shaped like:

        ```json

        {
          "transaction": {
            "linkingreference": "<from initial response>",
            "otp": "<code entered by customer>"
          }
        }

        ```

        Then poll **Check Payment Status** (Payment Query folder) with `paymentReference` to confirm the final state.
      operationId: post_card-payment_9
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              card-payment:
                summary: Card Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_card1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: CARD
                  cardDetails:
                    pan: "5060990580000217499"
                    expiryMonth: "03"
                    expiryYear: "2027"
                    cvv: "111"
                  callbackUrl: https://example.com/callback
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#bank-account-payment:
    post:
      tags:
        - PAYMENT METHODS
      summary: Bank Account Payment
      description: >-
        Initiates a direct bank-account debit: the customer authorizes a charge
        straight from their bank account (via account number + bank code) rather
        than a card, USSD code, or transfer-in.


        **Not confirmed against doc.seerbit.com** — two details on the Bank Account Payment doc page could not be pinned down and are flagged rather than guessed:

        1. The exact `paymentType` value for this flow (unlike `CARD`/`USSD`/`TRANSFER`/`MOMO`, the doc page doesn't spell this one out explicitly) — placeholder left in the sample body above; check the dashboard/API response or contact SeerBit support to confirm before using this request.

        2. The doc page references a separate **`/payments/validate`** endpoint for the OTP/authorization step, but doesn't give its full URL, method, or body — this conflicts with the Card Payment page, which documents OTP validation as a second POST to this *same* `/api/v2/payments/initiates` URL with a `{"transaction": {"linkingreference":..., "otp":...}}` body. It's unclear whether Bank Account Payment genuinely uses a different endpoint or the doc page is just describing the same flow loosely.


        **Body fields** (`accountNumber` + `bankCode` identify the account to debit; other fields match Card Payment). Verify the `paymentType` value and validation step directly with SeerBit before relying on this request.
      operationId: post_bank-account-payment_10
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              bank-account-payment:
                summary: Bank Account Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_bank1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: "**Not confirmed** — see description"
                  accountNumber: "0000000000"
                  bankCode: "058"
                  callbackUrl: https://example.com/callback
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#transfer:
    post:
      tags:
        - PAYMENT METHODS
      summary: Transfer
      description: >-
        Initiates a bank-transfer payment: SeerBit returns a dynamic virtual
        account number for this transaction that the customer transfers the
        exact amount into from their own banking app; SeerBit matches the credit
        and confirms the transaction. This is distinct from the **Virtual
        Accounts** folder, which provisions a *persistent* account number for a
        customer across many transactions — this is a one-off, per-transaction
        account.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `paymentType` | string | Yes | `TRANSFER` |

        | (other fields) | | Yes | Same core fields as Card Payment |


        Poll **Check Payment Status** (Payment Query folder) with `paymentReference`, or listen for the `transaction` webhook, to detect when the transfer lands.
      operationId: post_transfer_11
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              transfer:
                summary: Transfer
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_transfer1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: TRANSFER
                  callbackUrl: https://example.com/callback
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#ussd-payment:
    post:
      tags:
        - PAYMENT METHODS
      summary: USSD Payment
      description: >-
        Initiates a USSD payment: SeerBit returns a USSD string (e.g.
        `*723*...#`) the customer dials on their phone from the bank account
        linked to `bankCode` to authorize the debit — no card or app needed.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `paymentType` | string | Yes | `USSD` |

        | `bankCode` | string | Yes | Bank's USSD routing code, e.g. `058` for GTBank |

        | (other fields) | | Yes | Same `publicKey`/`amount`/`currency`/`country`/`paymentReference`/`email`/`fullName`/`callbackUrl` as Card Payment |


        The initial response includes the USSD code to display to the customer. Poll **Check Payment Status** (Payment Query folder) with `paymentReference` — there's no separate OTP step; authorization happens on the phone via the USSD session itself.
      operationId: post_ussd-payment_12
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              ussd-payment:
                summary: USSD Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: NGN
                  country: NG
                  paymentReference: payment_reference_ussd1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: USSD
                  bankCode: "058"
                  callbackUrl: https://example.com/callback
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/initiates#mobile-money-payment:
    post:
      tags:
        - PAYMENT METHODS
      summary: Mobile Money Payment
      description: >-
        Initiates a mobile-money payment (e.g. MTN MoMo, AirtelTigo) — SeerBit
        sends a prompt to the customer's phone on the given
        `mobileNumber`/`network`, and the customer approves the debit directly
        on their handset. Used primarily for Ghana (`GHS`) and other African
        mobile-money markets.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `paymentType` | string | Yes | `MOMO` |

        | `mobileNumber` | string | Yes | Customer's mobile-money-linked phone number |

        | `network` | string | Yes | Mobile network operator, e.g. `MTN`, `AIRTELTIGO`, `VODAFONE` |

        | (other fields) | | Yes | Same core fields as Card Payment |


        Poll **Check Payment Status** (Payment Query folder) with `paymentReference` after the customer approves the prompt on their phone.
      operationId: post_mobile-money-payment_13
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              mobile-money-payment:
                summary: Mobile Money Payment
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  currency: GHS
                  country: GH
                  paymentReference: payment_reference_momo1
                  email: customer@example.com
                  fullName: Jane Doe
                  paymentType: MOMO
                  mobileNumber: "233241234567"
                  network: MTN
                  callbackUrl: https://example.com/callback
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v3/payments/query/{paymentReference}":
    get:
      tags:
        - PAYMENT QUERY
      summary: Check Payment Status
      description: >-
        Looks up the current status of a transaction by its `paymentReference`.
        **Corrected to v3** — the doc.seerbit.com page for this actually
        documents `/api/v3/payments/query/{paymentReference}` (matching what
        *Get Card Authorization Code* already used), not v2 as this request
        previously had it. The v3 response includes fuller detail: status,
        amount, gateway message, masked card details, and customer info.


        Use this after Standard Checkout, Create Token, or any flow that returns a `paymentReference`, to confirm the final state rather than relying only on the initial response's `code`.


        **Tokenized Standard Checkout**: if the original Standard Checkout call had `tokenize: true`, this is where the `authorizationCode` for the saved card actually comes back — it is not in Standard Checkout's own response. Save it from here to use with *Charge Authorization Token* / *Bulk Charge Token*.
      operationId: get_check-payment-status_14
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: paymentReference
          in: path
          required: true
          description: Value of paymentReference
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
