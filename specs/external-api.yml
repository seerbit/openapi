  /pocket/authenticate#authenticate-for-payout:
    post:
      tags:
        - PAYOUT
      summary: Authenticate for Payout
      description: >-
        Logs in with your merchant account email and Pocket password to obtain
        the bearer token required by every other request in this payout flow.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `email` | string | Yes | Your merchant account's login email |

        | `password` | string | Yes | Your **Pocket password** — not your SeerBit merchant dashboard password. This is the password for your Pocket account at flow.seerbitapi.com. |


        **Response: 200 OK**

        ```json

        {
            "data": {
                "bearerToken": "..."
            }
        }

        ```

        Save `data.bearerToken` as `{{pocketAuthToken}}` — used as the `Authorization: Bearer` value on *Initiate Single Payout*, *Initiate Bulk Payout*, and *Confirm Payout with OTP*. This is the same login and token as *Authenticate* in the Pocket folder — kept as one shared variable, `{{pocketAuthToken}}`, and kept distinct from `{{BearerToken}}` (the OAuth token used everywhere else in this collection).


        **Note:** this is the only endpoint in this collection that authenticates with an email/password pair rather than an API key or OAuth token.
      operationId: post_authenticate-for-payout_46
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              authenticate-for-payout:
                summary: Authenticate for Payout
                value:
                  email: your-merchant-login-email@example.com
                  password: your-merchant-password
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /pocket/v2/payouts:
    post:
      tags:
        - PAYOUT
      summary: Initiate Single Payout
      description: >-
        Phase 1 of 2 — initiates a single payout. Validates the request
        signature, encrypts the payload, and emails an OTP to the merchant; the
        payout only moves money once that OTP is submitted to *Confirm Payout
        with OTP*.


        **Required headers**


        | Header | Description |

        |---|---|

        | `Public-Key` | Your merchant public key (`{{publicKey}}`) |

        | `X-Seerbit-Signature` | HMAC-SHA256 of the exact raw JSON request body, computed with your merchant secret key (`{{SECRET_KEY}}`), hex-encoded. |

        | `Authorization` | `Bearer {{pocketAuthToken}}` — from *Authenticate for Payout* (same token as Pocket's *Authenticate*), not the OAuth `{{BearerToken}}`. |


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `pocketId` | string | Yes | The Pocket to pay out from |

        | `reference` | string | Yes | Your unique reference for this payout. Re-submitting the same `reference` is idempotent — it returns the existing `payoutId` and a message that the OTP was already sent, rather than sending a new OTP. |

        | `currency` | string | Yes | Currency code |

        | `amount` | number | Yes | Amount to send |

        | `description` | string | No | Free-text note for the payout |

        | `accountNumber` | string | Yes | Recipient bank account number |

        | `bankCode` | string | Yes | Recipient bank's code — see *Bank List* |


        **Response: 202 Accepted**

        ```json

        {
            "payoutId": "PV2-ABCDEF123456",
            "status": "PENDING_OTP",
            "message": "OTP sent to registered email. Please confirm to proceed."
        }

        ```

        Save `payoutId` as the `{{payoutId}}` collection variable — it's the path parameter for *Confirm Payout with OTP*.


        **Error responses:**

        - 401 Unauthorized — missing or invalid `X-Seerbit-Signature`

        - 400 Bad Request — missing `Public-Key` header

        - 400 Bad Request — missing/invalid required fields (e.g. "currency is required", "amount must be positive")


        **Note:** this flow doesn't include a separate account-name-confirmation step before initiating — call *Account Enquiry* first if you want to verify the recipient's account name.
      operationId: post_initiate-single-payout_47
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              initiate-single-payout:
                summary: Initiate Single Payout
                value:
                  pocketId: SBP0016878
                  reference: PAY-SINGLE-Ideal-001
                  currency: NGN
                  amount: 10
                  description: Single Payout API test
                  accountNumber: "0522376248"
                  bankCode: "000013"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/pocket/v2/payouts/{payoutId}/confirm":
    post:
      tags:
        - PAYOUT
      summary: Confirm Payout with OTP
      description: >-
        Phase 2 of 2 — submits the OTP emailed to the merchant during *Initiate
        Single Payout* / *Initiate Bulk Payout*. On success, SeerBit decrypts
        the payload and dispatches it for processing; this is what actually
        moves money.


        **Path parameter**


        | Parameter | Description |

        |---|---|

        | `payoutId` (in URL path) | From the Initiate call's response, saved to `{{payoutId}}` |


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `otp` | string | Yes | 6-digit code emailed to the merchant. Expires 5 minutes after being issued. It's presumably sent to the email used to log in via *Authenticate for Payout*, though this isn't stated explicitly. |


        **Response: 200 OK**

        ```json

        {
            "payoutId": "PV2-ABCDEF123456",
            "status": "QUEUED",
            "message": "Payout confirmed and queued for processing",
            "batchId": "BATCH-XYZ"
        }

        ```


        **Error responses (400):**

        - Payout not found

        - Unauthorized access

        - Not in `PENDING_OTP` state

        - OTP has expired

        - Invalid OTP

        - Insufficient funds
      operationId: post_confirm-payout-with-otp_48
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: payoutId
          in: path
          required: true
          description: Value of payoutId
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              confirm-payout-with-otp:
                summary: Confirm Payout with OTP
                value:
                  otp: "123456"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /pocket/v2/payouts#initiate-bulk-payout:
    post:
      tags:
        - PAYOUT
      summary: Initiate Bulk Payout
      description: >-
        Phase 1 of 2 — initiates a payout to multiple recipients in one call,
        sharing a single OTP confirmation. Same endpoint as *Initiate Single
        Payout*; a non-empty `transfers` array is what puts the request in bulk
        mode.


        **Required headers:** same as *Initiate Single Payout* — `Public-Key`, `X-Seerbit-Signature` (HMAC-SHA256 of the raw body using `{{SECRET_KEY}}`), `Authorization: Bearer {{pocketAuthToken}}` from *Authenticate for Payout*.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `pocketId` | string | Yes | The Pocket to pay out from |

        | `batchReference` | string | Yes | Your unique reference for the whole batch. Re-submitting the same `batchReference` is idempotent — returns the existing `payoutId` rather than creating a new batch. |

        | `transfers` | array | Yes | One entry per recipient — see fields below. Must be non-empty to trigger bulk mode. |

        | `transfers[].reference` | string | Yes | Your unique reference for this individual transfer within the batch |

        | `transfers[].currency` | string | Yes | Currency code |

        | `transfers[].amount` | number | Yes | Amount to send to this recipient |

        | `transfers[].description` | string | No | Free-text note for this transfer |

        | `transfers[].accountNumber` | string | Yes | Recipient bank account number |

        | `transfers[].bankCode` | string | Yes | Recipient bank's code — see *Bank List* |


        **Response: 202 Accepted** — same shape as *Initiate Single Payout*: one `payoutId` for the whole batch, `status: "PENDING_OTP"`.


        **Note:** there's no documented endpoint for checking an individual transfer's outcome within a batch — only the batch-level `batchId` returned by *Confirm Payout with OTP*.
      operationId: post_initiate-bulk-payout_49
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              initiate-bulk-payout:
                summary: Initiate Bulk Payout
                value:
                  pocketId: SBP0003440
                  batchReference: BATCH-PAY-001
                  transfers:
                    - reference: BULK-REF-001
                      currency: NGN
                      amount: 500
                      description: Payment to vendor A
                      accountNumber: "0522376248"
                      bankCode: "000013"
                    - reference: BULK-REF-002
                      currency: NGN
                      amount: 500
                      description: Payment to vendor B
                      accountNumber: "0522376248"
                      bankCode: "000013"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
