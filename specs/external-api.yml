        Subscription* instead.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `publicKey` | string | Yes | Merchant public key |

        | `amount` | string | Yes | Amount to charge |

        | `paymentReference` | string | Yes | New, unique reference for this charge |

        | `authorizationCode` | string | Yes | From *Get Card Authorization Code* |
      operationId: post_charge-authorization-token_23
