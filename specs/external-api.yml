        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              charge-authorization-token:
                summary: Charge Authorization Token
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  paymentReference: charge_token_ref_001
                  authorizationCode: "{{authorizationCode}}"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/bulk-tokenize-charge:
    post:
      tags:
        - TOKENIZATION
      summary: Bulk Charge Token
      description: >-
        Same as *Charge Authorization Token*, but accepts a JSON array so you
        can charge many tokenized cards in one call. Each array entry needs its
        own unique `paymentReference`. Returns a `batchId` — poll *Query Bulk
        Charge* with it to see per-entry results, since a bulk call can
        partially succeed.


        **Body:** array of objects, each with the same fields as *Charge Authorization Token* (`publicKey`, `amount`, `paymentReference`, `authorizationCode`).
      operationId: post_bulk-charge-token_24
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              bulk-charge-token:
                summary: Bulk Charge Token
                value:
                  - publicKey: "{{publicKey}}"
                    amount: "5000.00"
                    paymentReference: bulk_ref_001
                    authorizationCode: "{{authorizationCode}}"
                  - publicKey: "{{publicKey}}"
                    amount: "2500.00"
                    paymentReference: bulk_ref_002
                    authorizationCode: "{{authorizationCode}}"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/bulk-tokenize-charge-search:
