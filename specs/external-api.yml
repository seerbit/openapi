  /api/v2/payments/create-token:
    post:
      tags:
        - TOKENIZATION
      summary: Create Token
      description: >-
        Charges a card for the first time **and** saves it, returning card
        details you can later exchange for an `authorizationCode` (via *Get Card
        Authorization Code*) to charge the same card again without re-collecting
        details. Requires the customer to complete 3DS/OTP authentication on
        `redirectUrl`.


        **Body fields**


        | Field | Type | Required | Description |

        |---|---|---|---|

        | `publicKey` | string | Yes | Merchant public key |

        | `amount` | string | Yes | Charge amount — minimum is currency-dependent (e.g. NGN 50, GHS 1, KES 1, USD 0.50) |

        | `fullName` | string | Yes | Cardholder's name |

        | `mobileNumber` | string | Yes | Customer phone number |

        | `email` | string | Yes | Customer email |

        | `currency` | string | Yes | Transaction currency |

        | `country` | string | Yes | Country of the transaction |

        | `paymentType` | string | Yes | Must be `"CARD"` |

        | `cardNumber` | string | Yes | Full card number |

        | `expiryMonth` | string | Yes | Two-digit expiry month (`01`–`12`) |

        | `expiryYear` | string | Yes | Card expiry year |

        | `cvv` | string | Yes | Card security code |

        | `pin` | string | Yes | Card PIN (required by some card schemes/issuers) |

        | `redirectUrl` | string | Yes | Where the customer lands after completing 3DS/OTP authentication |

        | `paymentReference` | string | Yes | Unique reference you generate per transaction |
      operationId: post_create-token_21
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              create-token:
                summary: Create Token
                value:
                  publicKey: "{{publicKey}}"
                  amount: "50"
                  fullName: Jane Smith
                  mobileNumber: "03447522256"
                  redirectUrl: http://example.com
                  currency: NGN
                  country: NG
                  paymentReference: 204g4de74a7ib0j18dg6bi521aiaejf4
                  email: janesmith@seerbit.com
                  paymentType: CARD
                  cardNumber: "512348984984988883"
                  expiryMonth: "01"
                  expiryYear: "25"
                  cvv: "000"
                  pin: "2222"
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v3/payments/query/{paymentReference}#get-card-authorization-code":
    get:
      tags:
        - TOKENIZATION
      summary: Get Card Authorization Code
      description: >-
        Returns authorizationCode, customerId and maskedPan for a tokenized
        transaction. Note this is v3, unlike the v2 Payment Query endpoint.


        **Response fields to read**


        | Field | Description |

        |---|---|

        | `authorizationCode` | Token to pass into *Charge Authorization Token* / *Bulk Charge Token* for future charges |

        | `customerId` | SeerBit's identifier for this customer, reusable across subscriptions |

        | `maskedPan` | Redacted card number for display, e.g. `5123-40xx-xxxx-0008` |
      operationId: get_get-card-authorization-code_22
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: paymentReference
          in: path
          required: true
          description: Value of paymentReference
          schema:
            type: string
