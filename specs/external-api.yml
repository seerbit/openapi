components:
  schemas:
    GenerateEncryptedSecretKeyRequest:
      title: GenerateEncryptedSecretKeyRequest
      required:
        - key
      type: object
      properties:
        key:
          type: string
          description: This consist of the PrivateKey and the publicKey separated with a '.' in the middle(eg:{privateKey.publicKey}
      example:
        key: SBTESTSECK_9Cb8dbqR5Rc2JwZaa77P5QYHzQaeGUcrkEMD1dEi.SBTESTPUBK_9sN3TuLgW6a9redEfY48cKKkUa09Pz2u
    GenerateHashRequest:
      title: GenerateHashRequest
      required:
        - amount
        - callbackUrl
        - country
        - currency
        - email
        - paymentReference
        - productDescription
        - productId
        - publicKey
      type: object
      properties:
        publicKey:
          type: string
          description: This is the merchant public key.
        amount:
          type: string
          description: This is the amount to be paid.
        currency:
          type: string
          description: This is the currency the transaction is to be carried out in.
        country:
          type: string
          description: This is the country from which the transaction is been carried out from
        paymentReference:
          type: string
          description: This is the unique identifier for a transaction, to be generated by merchant.
        email:
          type: string
          description: This is the email of the customer.
        productId:
          type: string
          description: This is the product id entered by the merchant.
        productDescription:
          type: string
          description: This is the product description supplied by the merchant.
        callbackUrl:
          type: string
      example:
        publicKey: SBTESTPUBK_9sN3TuLgW6a9redEfY48cKKkUa09Pz2u
        amount: "10.00"
        currency: NGN
        country: NG
        paymentReference: 3791090233047WZ73QN
        email: mamadou.diouf@intouchgroup.net
        productId: "15013"
        productDescription: touch badge
        callbackUrl: https://gutouch.com
    PaymentLinkFromCheckoutRequest:
      title: PaymentLinkFromCheckoutRequest
      required:
        - amount
        - callbackUrl
        - country
        - currency
        - email
        - fullName
        - tokenize
        - paymentReference
        # - productDescription
        # - productId
        - publicKey
      type: object
      properties:
        publicKey:
          type: string
          description: This is the merchant public key.
        amount:
          type: string
          description: This is the amount to be paid.
        currency:
          type: string
          description: This is the currency the transaction is to be carried out in.
        country:
          type: string
          description: This is the country from which the transaction is been carried out from
        paymentReference:
          type: string
          description: This is the unique identifier for a transaction, to be generated by merchant.
        email:
          type: string
          description: This is the email of the customer.
        fullName:
          type: string
          description: This is the full name of the customer.
        tokenize:
          type: boolean
          description: This indicates whether the card should be tokenized for future transactions.
        # productId:
        #   type: string
        #   description: This is the product id entered by the merchant.
        # productDescription:
        #   type: string
        #   description: This is the product description supplied by the merchant.
        callbackUrl:
          type: string
          description: This is the callback url supplied by the merchant so that Seerbit can redirect back to it .
        # hash:
        #   type: string
        #   description: This is the hash of the concatenated string for payment. Check hash module for more clarification.
        # hashType:
        #   type: string
        #   description: This refers to the hash type used in generating the hash
      example:
        publicKey: YOUR_PUBLIC_KEY
        amount: "10.00"
        currency: NGN
        country: NG
        paymentReference: payment_reference
        email: mamadou.diouf@intouchgroup.net
        fullName: Mamadou Diouf
        tokenize: false
        # productId: "15013"
        # productDescription: touch badge
        callbackUrl: https://seerbit.com
        # hash: cfb5464ea21cce315ea72fb28f7ea45c4b61c443783eeff82dea98e57d445e15
        # hashType: sha256
    OTPMomoRequest:
      title: OTPMomoRequest
      required:
        - linkingReference
        - otp
      type: object
      properties:
        linkingReference:
          type: string
          description: This is the internal gateway reference
        otp:
          type: string
          description: This is the TOKEN sent to customer’s phone or email
      example:
        linkingReference: CF630837081601460887752
        otp: "81015"
    ValidateTransactionRequest:
      title: ValidateTransactionRequest
      required:
        - linkingReference
        - otp
      type: object
      properties:
        linkingReference:
          type: string
          description: This is the internal gateway reference
        otp:
          type: string
          description: This is the TOKEN sent to customer’s phone or email
      example:
        linkingReference: F092648971601293723061
        otp: "123456"

