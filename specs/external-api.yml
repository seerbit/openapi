  /api/v2/payments/create-token:
    post:
      tags:
        - TOKENIZATION
      summary: Create Token
      description: Tokenize cards and use authorization tokens for subsequent or bulk
        charges.
      operationId: post_create-token_21
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                  description: Merchant public key
                amount:
                  type: string
                  description: Charge amount — minimum is currency-dependent (e.g. NGN 50, GHS 1,
                    KES 1, USD 0.50)
                fullName:
                  type: string
                  description: Cardholder's name
                mobileNumber:
                  type: string
                  description: Customer phone number
                email:
                  type: string
                  description: Customer email
                currency:
                  type: string
                  description: Transaction currency
                country:
                  type: string
                  description: Country of the transaction
                paymentType:
                  type: string
                  description: Must be `"CARD"`
                cardNumber:
                  type: string
                  description: Full card number
                expiryMonth:
                  type: string
                  description: Two-digit expiry month (`01`–`12`)
                expiryYear:
                  type: string
                  description: Card expiry year
                cvv:
                  type: string
                  description: Card security code
                pin:
                  type: string
                  description: Card PIN (required by some card schemes/issuers)
                redirectUrl:
                  type: string
                  description: Where the customer lands after completing 3DS/OTP authentication
                paymentReference:
                  type: string
                  description: Unique reference you generate per transaction
              required:
                - publicKey
                - amount
                - fullName
                - mobileNumber
                - email
                - currency
                - country
                - paymentType
                - cardNumber
                - expiryMonth
                - expiryYear
                - cvv
                - pin
                - redirectUrl
                - paymentReference
            examples:
              create-token:
                summary: Create Token
                value:
                  publicKey: "{{publicKey}}"
                  amount: "50"
                  fullName: Jane Smith
                  mobileNumber: "03447522256"
                  redirectUrl: http://example.com
                  currency: NGN
                  country: NG
                  paymentReference: 204g4de74a7ib0j18dg6bi521aiaejf4
                  email: janesmith@seerbit.com
                  paymentType: CARD
                  cardNumber: "512348984984988883"
                  expiryMonth: "01"
                  expiryYear: "25"
                  cvv: "000"
                  pin: "2222"
        description: >-
          Charges a card for the first time **and** saves it, returning card
          details you can later exchange for an `authorizationCode` (via *Get
          Card Authorization Code*) to charge the same card again without
          re-collecting details. Requires the customer to complete 3DS/OTP
          authentication on `redirectUrl`.


          **Body fields**
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  "/api/v3/payments/query/{paymentReference}#get-card-authorization-code":
    get:
      tags:
        - TOKENIZATION
      summary: Get Card Authorization Code
      description: >-
        Returns authorizationCode, customerId and maskedPan for a tokenized
        transaction. Note this is v3, unlike the v2 Payment Query endpoint.


        **Response fields to read**


        | Field | Description |

        |---|---|

        | `authorizationCode` | Token to pass into *Charge Authorization Token* / *Bulk Charge Token* for future charges |

        | `customerId` | SeerBit's identifier for this customer, reusable across subscriptions |

        | `maskedPan` | Redacted card number for display, e.g. `5123-40xx-xxxx-0008` |
      operationId: get_get-card-authorization-code_22
      servers:
        - url: https://seerbitapi.com
      parameters:
        - name: paymentReference
          in: path
          required: true
          description: Value of paymentReference
          schema:
            type: string
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/charge-token:
    post:
      tags:
        - TOKENIZATION
      summary: Charge Authorization Token
      description: Tokenize cards and use authorization tokens for subsequent or bulk
        charges.
      operationId: post_charge-authorization-token_23
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                  description: Merchant public key
                amount:
                  type: string
                  description: Amount to charge
                paymentReference:
                  type: string
                  description: New, unique reference for this charge
                authorizationCode:
                  type: string
                  description: From *Get Card Authorization Code*
              required:
                - publicKey
                - amount
                - paymentReference
                - authorizationCode
            examples:
              charge-authorization-token:
                summary: Charge Authorization Token
                value:
                  publicKey: "{{publicKey}}"
                  amount: "5000.00"
                  paymentReference: charge_token_ref_001
                  authorizationCode: "{{authorizationCode}}"
        description: >-
          Charges a previously tokenized card using its `authorizationCode`,
          without asking the customer for card details again. Use this for
          one-off repeat charges; for scheduled recurring billing, use *Charge
          Subscription* instead.


          **Body fields**
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/bulk-tokenize-charge:
    post:
      tags:
        - TOKENIZATION
      summary: Bulk Charge Token
      description: Tokenize cards and use authorization tokens for subsequent or bulk
        charges.
      operationId: post_bulk-charge-token_24
      servers:
        - url: https://seerbitapi.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  publicKey:
                    type: string
                  amount:
                    type: string
                  paymentReference:
                    type: string
                  authorizationCode:
                    type: string
            examples:
              bulk-charge-token:
                summary: Bulk Charge Token
                value:
                  - publicKey: "{{publicKey}}"
                    amount: "5000.00"
                    paymentReference: bulk_ref_001
                    authorizationCode: "{{authorizationCode}}"
                  - publicKey: "{{publicKey}}"
                    amount: "2500.00"
                    paymentReference: bulk_ref_002
                    authorizationCode: "{{authorizationCode}}"
        description: >-
          Same as *Charge Authorization Token*, but accepts a JSON array so you
          can charge many tokenized cards in one call. Each array entry needs
          its own unique `paymentReference`. Returns a `batchId` — poll *Query
          Bulk Charge* with it to see per-entry results, since a bulk call can
          partially succeed.


          **Body:** array of objects, each with the same fields as *Charge Authorization Token* (`publicKey`, `amount`, `paymentReference`, `authorizationCode`).
      responses:
        "200":
          description: Successful response
      security:
        - BearerAuth: []
  /api/v2/payments/bulk-tokenize-charge-search:
    get:
      tags:
        - TOKENIZATION
      summary: Query Bulk Charge
      description: Looks up the outcome of a *Bulk Charge Token* batch by `batchId`.
